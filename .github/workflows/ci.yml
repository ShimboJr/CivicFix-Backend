# .github/workflows/ci.yml  (CivicFix-Backend)
#
# Runs ESLint and the Jest test suite on every push and pull_request to main.
# On a direct push to main that passes CI, deploys to Vercel production and
# runs a post-deploy health check against /api/health.
#
# NOTE — monorepo context:
#   The frontend lives in a separate repository (CivicFix-Frontend) and has its
#   own CI workflow there.  This workflow covers the backend only.
#
# NOTE — path filtering:
#   All steps run on every push regardless of which files changed.  Path-based
#   filtering would speed things up but isn't worth the added complexity at this
#   project's current size.
#
# NOTE — Vercel auto-deploy:
#   Vercel's automatic Git deployment for production has been disabled.
#   Production is updated exclusively via the `deploy` job below.

name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Lint + Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'          # LTS — matches the project's target runtime
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # Env vars that must exist so modules don't crash on missing values at
        # import time.  These are NOT real secrets — they are stubs.  Tests use
        # mongodb-memory-server for an isolated in-memory database and never call
        # Cloudinary, send real emails, or touch the Atlas cluster.
        env:
          NODE_ENV:               test
          JWT_SECRET:             ci_test_secret
          JWT_EXPIRES_IN:         1h
          CLOUDINARY_CLOUD_NAME:  test
          CLOUDINARY_API_KEY:     test
          CLOUDINARY_API_SECRET:  test
          EMAIL_HOST:             localhost
          EMAIL_PORT:             "1025"
          EMAIL_USER:             test@localhost
          EMAIL_PASS:             test
          CLIENT_URL:             http://localhost:5173
        run: npm test

  # ─── Production Deployment ───────────────────────────────────────────────────
  # Runs only on a direct push to main (never on pull requests) and only after
  # the `backend` job (Lint + Test) has succeeded.  If `backend` fails this job
  # is skipped entirely — production is never touched.
  deploy:
    name: Deploy to Vercel (production)
    needs: [backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the Vercel CLI globally so the subsequent steps can call `vercel`.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull Vercel project metadata and production environment variables into
      # the local .vercel/ directory.  --yes skips the interactive prompts.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      # Build the project using Vercel's build pipeline.  The output is placed
      # in .vercel/output/ and referenced by the deploy step.
      - name: Build project
        run: vercel build --prod --token=$VERCEL_TOKEN

      # Deploy the pre-built output to production and capture the deployment URL
      # so the health-check and promote steps can target it directly.
      #
      # stderr is redirected to a temp file and re-emitted to the step's own
      # stderr so diagnostic output from the CLI is still visible in the log
      # without polluting the stdout capture used to extract the URL.
      - name: Deploy to production
        id: deploy
        run: |
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN \
            2>deploy_stderr.txt \
            | tee deploy_stdout.txt
          cat deploy_stderr.txt >&2
          NEW_DEPLOYMENT_URL=$(cat deploy_stdout.txt | grep -E '^https://' | tail -1 | tr -d '[:space:]')
          echo "New deployment URL: ${NEW_DEPLOYMENT_URL}"
          echo "url=${NEW_DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"

      # ─── Post-deploy health check (new deployment URL) ────────────────────────
      # Verifies the freshly-deployed function is healthy BEFORE we alias the
      # custom production domain to it.  Gates the promote step entirely.
      #
      # Strategy:
      #   • Retry up to 6 times with 10-second back-off to allow for cold starts.
      #   • Fail the workflow (and surface an error) if the server returns a 5xx
      #     or is unreachable — anything in the 2xx/3xx/4xx range is treated as
      #     "the server is alive and running".
      - name: Health check — new deployment URL
        env:
          NEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Running health check against ${NEW_DEPLOYMENT_URL}/api/health"
          for i in 1 2 3 4 5 6; do
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 15 "${NEW_DEPLOYMENT_URL}/api/health" || echo "000")
            echo "Attempt ${i}: HTTP ${HTTP_STATUS}"
            if [ "$HTTP_STATUS" -ge 500 ] 2>/dev/null; then
              echo "Server returned ${HTTP_STATUS} — deployment is unhealthy."
              if [ "$i" -lt 6 ]; then
                echo "Retrying in 10 s..."
                sleep 10
              else
                echo "Health check failed after 6 attempts. Aborting promote."
                exit 1
              fi
            elif [ "$HTTP_STATUS" = "000" ]; then
              echo "Could not reach the deployment endpoint."
              if [ "$i" -lt 6 ]; then
                echo "Retrying in 10 s..."
                sleep 10
              else
                echo "Health check failed after 6 attempts. Aborting promote."
                exit 1
              fi
            else
              echo "Health check passed (HTTP ${HTTP_STATUS}). Proceeding to promote."
              exit 0
            fi
          done

      # ─── Promote to custom production domain ──────────────────────────────────
      # Because "Auto-assign Custom Production Domains" is disabled on this
      # project, `vercel deploy --prod` creates a production-flagged deployment
      # but does NOT move the custom domain alias.  An explicit `vercel promote`
      # is required to make civicfix-backend.vercel.app serve the new build.
      #
      # --yes suppresses the interactive confirmation prompt.
      - name: Promote to production domain
        env:
          NEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Promoting ${NEW_DEPLOYMENT_URL} to production domain..."
          vercel promote "${NEW_DEPLOYMENT_URL}" --yes --token=$VERCEL_TOKEN
          echo "Promote command completed."

      # ─── Post-promote verification (custom domain) ────────────────────────────
      # Confirms the promotion actually took effect by hitting the custom domain
      # directly — not just trusting that the promote command exited 0.
      #
      # Uses the same retry strategy as the deployment health check above.
      - name: Verify custom production domain
        run: |
          PROD_DOMAIN="https://civicfix-backend.vercel.app"
          echo "Verifying custom domain: ${PROD_DOMAIN}/api/health"
          for i in 1 2 3 4 5 6; do
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 15 "${PROD_DOMAIN}/api/health" || echo "000")
            echo "Attempt ${i}: HTTP ${HTTP_STATUS}"
            if [ "$HTTP_STATUS" -ge 500 ] 2>/dev/null; then
              echo "Custom domain returned ${HTTP_STATUS} — promote may have failed."
              if [ "$i" -lt 6 ]; then
                echo "Retrying in 10 s..."
                sleep 10
              else
                echo "Custom domain verification failed after 6 attempts."
                exit 1
              fi
            elif [ "$HTTP_STATUS" = "000" ]; then
              echo "Could not reach the custom domain."
              if [ "$i" -lt 6 ]; then
                echo "Retrying in 10 s..."
                sleep 10
              else
                echo "Custom domain verification failed after 6 attempts."
                exit 1
              fi
            else
              echo "Custom domain verification passed (HTTP ${HTTP_STATUS}). Deploy complete."
              exit 0
            fi
          done
